[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contamination-audit"
version = "0.1.2"
description = "Generate item-level eval contamination signals from lexical, canary, pattern, hash, and optional embedding checks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne" }]
keywords = ["evaluation-data", "data-contamination", "benchmark-leakage", "llm-evaluation", "canary", "embedding-similarity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
embedding = ["sentence-transformers>=2.7"]

[project.urls]
Homepage = "https://github.com/auraoneai/contamination-audit"
Documentation = "https://github.com/auraoneai/contamination-audit#readme"
Repository = "https://github.com/auraoneai/contamination-audit.git"
Issues = "https://github.com/auraoneai/contamination-audit/issues"
Changelog = "https://github.com/auraoneai/contamination-audit/blob/main/CHANGELOG.md"

[project.scripts]
contamination-audit = "contamination_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
